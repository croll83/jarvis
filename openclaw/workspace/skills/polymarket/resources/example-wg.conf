# Example Mullvad WireGuard config
# Download your own from: https://mullvad.net/en/account/wireguard-config
# Choose: Country = Spain (or any non-geoblocked country), Port = 51820

[Interface]
PrivateKey = YOUR_PRIVATE_KEY_HERE
Address = 10.x.x.x/32,fc00:bbbb:bbbb:bb01::x:xx/128
DNS = 10.64.0.1

[Peer]
PublicKey = SERVER_PUBLIC_KEY_HERE
AllowedIPs = 0.0.0.0/0,::0/0
Endpoint = SERVER_IP:51820
