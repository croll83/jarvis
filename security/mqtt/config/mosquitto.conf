# Mosquitto MQTT Broker Configuration
# For JARVIS Security Stack

# Network
listener 1883
listener 9001
protocol websockets

# Allow anonymous access (internal network only)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Security (uncomment for production with authentication)
# password_file /mosquitto/config/passwd
# allow_anonymous false
