host_id: lxc-ai-agent
collector_url: http://100.88.84.81:5000/api/admin/logs/ingest

batch_interval: 2.0
batch_size: 100

sources:
  - name: hermes-marco
    type: journalctl-user
    target: hermes-gateway-hermes-marco

  - name: hermes-ada
    type: journalctl-user
    target: hermes-gateway-hermes-ada

  - name: hermes-dark
    type: journalctl-user
    target: hermes-gateway-hermes-dark

  - name: hermes-shared
    type: journalctl-user
    target: hermes-gateway-hermes-shared

  - name: hermes-billing-proxy
    type: journalctl-user
    target: hermes-billing-proxy

  - name: wireproxy-mullvad
    type: journalctl-user
    target: wireproxy-mullvad

  - name: nginx
    type: file
    target: /var/log/nginx/error.log

  - name: ontology-server
    type: docker
    target: jarvis_ontology
