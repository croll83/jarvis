host_id: lxc-jarvis
collector_url: http://127.0.0.1:5000/api/admin/logs/ingest

batch_interval: 2.0
batch_size: 100

sources:
  - name: orchestrator
    type: docker
    target: jarvis_core

  - name: llama-router
    type: journalctl
    target: llama-router

  - name: fastembed
    type: docker
    target: jarvis_fastembed

  - name: mem0
    type: docker
    target: jarvis_mem0

  - name: chromadb
    type: docker
    target: jarvis_chromadb

  - name: postgres
    type: docker
    target: jarvis_postgres

  - name: mongodb
    type: docker
    target: jarvis_mongo

  - name: redis
    type: docker
    target: jarvis_redis

  - name: nginx
    type: file
    target: /var/log/nginx/jarvis.error.log
