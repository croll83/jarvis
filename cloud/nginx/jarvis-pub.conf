# =============================================================================
# JARVIS Public Endpoint — Nginx Configuration
# =============================================================================
# Domain: jarvis-pub.mintwork.it (DNS A record -> 46.224.182.165 public IP)
# Purpose: Telegram webhook (HTTPS) + health check.
#
# All device management endpoints (device_config, heartbeat, device_status,
# room_temperature, speaker/*, devices/*) have been migrated to the local
# wakeword-server, which proxies them to the orchestrator via Tailscale.
# This eliminates device bearer tokens from the public internet.
#
# Audio traffic (WS/voice) was already removed in a previous migration.
# AtomS3R devices stream audio to the local wakeword-server (LAN), which
# relays to the orchestrator via Tailscale when a wake word is detected.
#
# Exposed endpoints:
#   HTTP (80):
#     GET  /health
#
#   HTTPS (443):
#     POST /telegram_webhook
#     GET  /health
#
# Installation:
#   sudo cp jarvis-pub.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/jarvis-pub.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL:
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d jarvis-pub.mintwork.it

# ─────────────────────────────────────────────────────────────────────────────
# HTTP (port 80) — Health check only
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name jarvis-pub.mintwork.it;

    # Logging
    access_log /var/log/nginx/jarvis-pub-http.access.log;
    error_log /var/log/nginx/jarvis-pub-http.error.log;

    # ── Health check (no auth needed) ──
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Everything else → 404 ──
    location / {
        return 404 '{"error": "not found"}';
        add_header Content-Type application/json;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS (port 443) — Telegram webhook + health check
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jarvis-pub.mintwork.it;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/jarvis-pub.mintwork.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis-pub.mintwork.it/privkey.pem;

    # SSL settings (modern configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_PUB:10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/jarvis-pub.access.log;
    error_log /var/log/nginx/jarvis-pub.error.log;

    # ── Telegram webhook (Telegram requires HTTPS) ──
    location /telegram_webhook {
        # Telegram sends from fixed IP ranges, but we verify via bot token in URL
        proxy_pass http://127.0.0.1:5000/telegram_webhook;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # ── Health check ──
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Everything else → 404 ──
    location / {
        return 404 '{"error": "not found"}';
        add_header Content-Type application/json;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
