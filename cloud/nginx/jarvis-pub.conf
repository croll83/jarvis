# =============================================================================
# JARVIS Public Endpoint — Nginx Configuration
# =============================================================================
# Domain: jarvis-pub.mintwork.it (DNS A record -> 46.224.182.165 public IP)
# Purpose: Exposes ONLY device endpoints (bearer-protected) + Telegram webhook
#
# Exposed endpoints:
#   HTTP (80) — Device endpoints only (low-latency, bearer-token auth):
#     POST /voice_command
#     POST /voice_stream
#     POST /speaker/suppress
#     POST /speaker/restore
#     GET  /speaker/suppressed
#     GET  /device_config
#     POST /heartbeat
#     GET  /device_status
#     GET  /room_temperature/{room}
#     GET  /health
#
#   HTTPS (443) — Device endpoints + Telegram webhook:
#     (same as HTTP) +
#     POST /telegram_webhook
#
# Installation:
#   sudo cp jarvis-pub.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/jarvis-pub.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL:
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d jarvis-pub.mintwork.it

# Rate limiting zone (separate from jarvis.mintwork.it)
limit_req_zone $binary_remote_addr zone=jarvis_pub_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=jarvis_pub_voice:10m rate=5r/s;

# ─────────────────────────────────────────────────────────────────────────────
# HTTP (port 80) — Device endpoints only, no TLS overhead for low latency
# Bearer token provides authentication. All other paths → 404.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name jarvis-pub.mintwork.it;

    # Logging
    access_log /var/log/nginx/jarvis-pub-http.access.log;
    error_log /var/log/nginx/jarvis-pub-http.error.log;

    # ── Voice stream (special handling: large body, no buffering) ──
    location /voice_stream {
        limit_req zone=jarvis_pub_voice burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000/voice_stream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through Authorization header (bearer token)
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
    }

    # ── Voice command (legacy JSON endpoint) ──
    location /voice_command {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/voice_command;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── Speaker suppress/restore/suppressed ──
    location /speaker/ {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/speaker/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Device config (first boot + periodic config fetch) ──
    location /device_config {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/device_config;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Heartbeat (periodic device check-in) ──
    location /heartbeat {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/heartbeat;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Device status (is JARVIS speaking?) ──
    location /device_status {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/device_status;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Room temperature (periodic fetch from device) ──
    location /room_temperature/ {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/room_temperature/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Health check (no auth needed) ──
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Everything else → 404 ──
    location / {
        return 404 '{"error": "not found"}';
        add_header Content-Type application/json;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS (port 443) — Device endpoints + Telegram webhook
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jarvis-pub.mintwork.it;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/jarvis-pub.mintwork.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis-pub.mintwork.it/privkey.pem;

    # SSL settings (modern configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_PUB:10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/jarvis-pub.access.log;
    error_log /var/log/nginx/jarvis-pub.error.log;

    # ── Voice stream ──
    location /voice_stream {
        limit_req zone=jarvis_pub_voice burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000/voice_stream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
    }

    # ── Voice command ──
    location /voice_command {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/voice_command;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── Speaker suppress/restore/suppressed ──
    location /speaker/ {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/speaker/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Device config (first boot + periodic config fetch) ──
    location /device_config {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/device_config;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Heartbeat (periodic device check-in) ──
    location /heartbeat {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/heartbeat;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Device status (is JARVIS speaking?) ──
    location /device_status {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/device_status;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Telegram webhook (Telegram requires HTTPS) ──
    location /telegram_webhook {
        # Telegram sends from fixed IP ranges, but we verify via bot token in URL
        proxy_pass http://127.0.0.1:5000/telegram_webhook;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # ── Room temperature ──
    location /room_temperature/ {
        limit_req zone=jarvis_pub_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/room_temperature/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Health check ──
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Everything else → 404 ──
    location / {
        return 404 '{"error": "not found"}';
        add_header Content-Type application/json;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
