# =============================================================================
# OpenClaw Dashboard — Nginx Configuration
# =============================================================================
# Domain: openclaw.mintwork.it (DNS A record -> Tailscale IP)
# SSL: certbot with Cloudflare DNS challenge
#
# Installation:
#   sudo cp openclaw.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/openclaw.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=openclaw_limit:10m rate=10r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name openclaw.mintwork.it;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openclaw.mintwork.it;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/openclaw.mintwork.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openclaw.mintwork.it/privkey.pem;

    # SSL settings (modern configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/openclaw.access.log;
    error_log /var/log/nginx/openclaw.error.log;

    # Proxy to OpenClaw gateway (Tailscale IP, bind: tailnet)
    location / {
        limit_req zone=openclaw_limit burst=20 nodelay;

        # OpenClaw ascolta sull'IP Tailscale, non su localhost
        proxy_pass http://100.100.74.71:18789;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (needed for OpenClaw dashboard)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;

        client_max_body_size 10M;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://100.100.74.71:18789/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
}
