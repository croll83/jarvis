version: '3.8'

# =============================================================================
# JARVIS Cloud Stack
# Deploy su VPS senza GPU - Usa API esterne per AI
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Tailscale - VPN Mesh per raggiungere HA remoti
  # ---------------------------------------------------------------------------
  tailscale:
    image: tailscale/tailscale:latest
    container_name: jarvis_tailscale
    hostname: jarvis-${TAILSCALE_HOSTNAME:-cloud}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--accept-routes
    networks:
      - jarvis_net
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Orchestrator - JARVIS Core (OpenClaw Skill)
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ../jarvis-orchestrator
      dockerfile: Dockerfile
    container_name: jarvis_orchestrator
    depends_on:
      tailscale:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ../data:/app/data
      - ../voice_models:/app/voice_models
    env_file: .env
    environment:
      - AI_BACKEND=api
      - OPENCLAW_URL=http://openclaw:18789
      - OPENCLAW_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
    networks:
      - jarvis_net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # OpenClaw - AI Brain (Gemini 3 Pro)
  # ---------------------------------------------------------------------------
  openclaw:
    image: openclaw/openclaw:latest
    container_name: jarvis_openclaw
    ports:
      - "18789:18789"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - ../jarvis-orchestrator/skill:/home/node/.openclaw/skills/jarvis-orchestrator:ro
      - openclaw_data:/home/node/.openclaw
    networks:
      - jarvis_net
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  jarvis_net:
    name: jarvis_cloud
    driver: bridge

volumes:
  tailscale_data:
  openclaw_data:
