# =============================================================================
# JARVIS Cloud Stack
# Deploy su VPS senza GPU - Usa API esterne per AI
#
# NOTA: OpenClaw gira bare-metal (non in Docker) sulla stessa macchina.
# NOTA: Tailscale gira host-level (non in Docker) per connettere HA remoti,
#       OpenClaw e la dashboard alla tailnet.
#
# Prerequisiti host-level (vedi cloud/README.md):
#   - Tailscale installato e connesso (tailscale up --hostname=jarvis-cloud)
#   - OpenClaw installato e attivo (systemctl start openclaw)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Orchestrator - JARVIS Core (OpenClaw Skill)
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ../jarvis-orchestrator
      dockerfile: Dockerfile
    container_name: jarvis_orchestrator
    network_mode: host
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
      - ../voice_models:/app/voice_models
      # Mount OpenClaw dir for exec-approvals Unix socket
      - /home/jarvis/.openclaw:/home/jarvis/.openclaw
    env_file: .env
    environment:
      - AI_BACKEND=api
      # OpenClaw gira bare-metal — se bind=tailnet, usa IP Tailscale (tailscale ip -4)
      # Se bind=loopback, usa http://localhost:18789
      - OPENCLAW_URL=${OPENCLAW_URL:-http://localhost:18789}
      - OPENCLAW_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      # Exec approval socket (NDJSON protocol via Unix socket)
      # Path dove il nostro server ascolta; OpenClaw si connette qui
      - OPENCLAW_APPROVAL_SOCKET_PATH=${OPENCLAW_APPROVAL_SOCKET_PATH:-/home/jarvis/.openclaw/exec-approvals.sock}
      - OPENCLAW_APPROVAL_SOCKET_TOKEN=${OPENCLAW_APPROVAL_SOCKET_TOKEN:-}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
