# =============================================================================
# JARVIS Cloud Stack
# Deploy su VPS senza GPU - Usa API esterne per AI
#
# TTS ENGINE:
#   - Default: XTTS remoto su LXC-JARVIS via Tailscale (TTS_ENGINE=xtts nel .env)
#   - Fallback: Kokoro-82M locale CPU (TTS_ENGINE=kokoro + profilo "kokoro")
#   Se si usa XTTS remoto, il container kokoro-tts non serve — non avviarlo.
#   Se si usa Kokoro: docker compose --profile kokoro up -d
#
# NOTA: OpenClaw gira bare-metal (non in Docker) sulla stessa macchina.
# NOTA: Tailscale gira host-level (non in Docker) per connettere HA remoti,
#       OpenClaw e la dashboard alla tailnet.
#
# Prerequisiti host-level (vedi cloud/README.md):
#   - Tailscale installato e connesso (tailscale up --hostname=jarvis-cloud)
#   - OpenClaw installato e attivo (systemctl start openclaw)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # TTS FALLBACK - Kokoro-82M (CPU, voce italiana if_sara)
  # Attivo solo con profilo "kokoro": docker compose --profile kokoro up -d
  # Non necessario se si usa XTTS remoto via Tailscale (default)
  # ---------------------------------------------------------------------------
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.1
    container_name: jarvis_kokoro_tts
    ports:
      - "8890:8880"
    environment:
      - KOKORO_DEFAULT_VOICE=if_sara
    restart: unless-stopped
    profiles:
      - kokoro
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Orchestrator - JARVIS Core (OpenClaw Skill)
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ../jarvis-orchestrator
      dockerfile: Dockerfile
    container_name: jarvis_orchestrator
    network_mode: host
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
      - ../voice_models:/app/voice_models
    env_file: .env
    environment:
      - AI_BACKEND=api
      # OpenClaw gira bare-metal — TLS via Let's Encrypt
      - OPENCLAW_URL=${OPENCLAW_URL:-https://openclaw.mintwork.it:18789}
      - OPENCLAW_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      # Gateway WS for exec approval operator (same host/port, wss:// scheme)
      - OPENCLAW_WS_URL=${OPENCLAW_WS_URL:-wss://openclaw.mintwork.it:18789}
      # TTS — configurato via .env (TTS_ENGINE, XTTS_URL o KOKORO_TTS_URL)
      # Default: XTTS su LXC-JARVIS remoto via Tailscale
      - TTS_ENGINE=${TTS_ENGINE:-xtts}
      - XTTS_URL=${XTTS_URL:-}
      - XTTS_SPEAKER=${XTTS_SPEAKER:-default}
      - XTTS_LANGUAGE=${XTTS_LANGUAGE:-it}
      - KOKORO_TTS_URL=${KOKORO_TTS_URL:-http://localhost:8890}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Ontology Server - Knowledge Graph API (SQLite + FastAPI + ACL)
  # Single source of truth per l'intero ecosistema di agent.
  # ACL basata su X-Speaker-Id: filtra entita per visibilita (private/family/public).
  # Raggiungibile da:
  #   - Orchestrator: http://127.0.0.1:8100 (network_mode: host)
  #   - OpenClaw (bare-metal): http://127.0.0.1:8100 (porta esposta su localhost)
  #   - Dashboard (Tailscale): http://<tailscale-ip>:8100/dashboard (smartphone)
  # ---------------------------------------------------------------------------
  ontology-server:
    build:
      context: ../ontology-server
      dockerfile: Dockerfile
    container_name: jarvis_ontology
    volumes:
      - ontology_data:/app/data
    ports:
      - "127.0.0.1:8100:8100"
      - "${TAILSCALE_IP:-100.100.74.71}:8100:8100"
    environment:
      - ONTOLOGY_DB_PATH=/app/data/graph.db
      - ONTOLOGY_SCHEMA_PATH=/app/schema.yaml
      - ONTOLOGY_API_TOKEN=${ONTOLOGY_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # ChromaDB - Shared Vector Store (CPU-only)
  # Condiviso tra orchestrator, HA memory service e OpenClaw
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: jarvis_chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  chroma_data:
  ontology_data:
