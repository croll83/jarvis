services:
  wakeword-server:
    build: .
    container_name: jarvis_wakeword
    network_mode: host
    environment:
      - ORCHESTRATOR_WS_URL=${ORCHESTRATOR_WS_URL}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-}
      - DEVICE_API_TOKEN=${DEVICE_API_TOKEN}
      - WAKEWORD_MODEL=${WAKEWORD_MODEL:-hey_jarvis}
      - WAKEWORD_THRESHOLD=${WAKEWORD_THRESHOLD:-0.5}
      - MULTIROOM_COOLDOWN_S=${MULTIROOM_COOLDOWN_S:-5}
      - LOCATION_ID=${LOCATION_ID:-}
      - HUB_HOST=${HUB_HOST:-}
      - HUB_PORT=${HUB_PORT:-0}
      - AEC_BACKEND=${AEC_BACKEND:-webrtc}
    volumes:
      - wakeword_data:/app/data
    restart: unless-stopped

volumes:
  wakeword_data:
