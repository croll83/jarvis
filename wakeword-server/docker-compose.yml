services:
  wakeword-server:
    build: .
    container_name: jarvis_wakeword
    network_mode: host
    environment:
      - ORCHESTRATOR_WS_URL=${ORCHESTRATOR_WS_URL}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-}
      - DEVICE_API_TOKEN=${DEVICE_API_TOKEN}
      - WAKEWORD_MODEL=${WAKEWORD_MODEL:-hey_jarvis}
      - WAKEWORD_THRESHOLD=${WAKEWORD_THRESHOLD:-0.5}
      - MULTIROOM_COOLDOWN_S=${MULTIROOM_COOLDOWN_S:-5}
      - LOCATION_ID=${LOCATION_ID:-}
      - HUB_HOST=${HUB_HOST:-}
      - HUB_PORT=${HUB_PORT:-0}
      - AEC_BACKEND=${AEC_BACKEND:-webrtc}
      - AEC_DEBUG_DIR=${AEC_DEBUG_DIR:-}
      - AEC_RENDER_DELAY_MS=${AEC_RENDER_DELAY_MS:-0}
      - HUB_ATOM_MIC_GAIN_DB=${HUB_ATOM_MIC_GAIN_DB:-}
      # Fase 3 (wake -> Gemini Live): shadow del pre-roll e archivio clip accesi, il resto spento
      - WAKE_PREROLL_SHADOW=${WAKE_PREROLL_SHADOW:-1}
      - WAKE_CLIP_ARCHIVE=${WAKE_CLIP_ARCHIVE:-1}
      - WAKE_CLIP_DIR=${WAKE_CLIP_DIR:-/app/data/wakeclips}
      - WAKE_CLIP_MAX_FILES=${WAKE_CLIP_MAX_FILES:-3000}
      - WAKE_CLIP_MAX_MB=${WAKE_CLIP_MAX_MB:-200}
      - WAKE_VOICE_GATE=${WAKE_VOICE_GATE:-auto}
      - WAKE_VOICE_GATE_TIMEOUT_S=${WAKE_VOICE_GATE_TIMEOUT_S:-1.0}
      - LIVE_ON_WAKE=${LIVE_ON_WAKE:-1}
    volumes:
      - wakeword_data:/app/data
    restart: unless-stopped

volumes:
  wakeword_data:
