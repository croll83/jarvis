---
# =============================================================================
# JARVIS — Master Playbook
# =============================================================================
# Esegue tutti gli step di provisioning in ordine.
#
# Utilizzo:
#   ansible-playbook playbooks/site.yml                    # Deploy completo
#   ansible-playbook playbooks/site.yml --tags common      # Solo sistema + Docker
#   ansible-playbook playbooks/site.yml --tags nvidia      # Solo NVIDIA (GPU)
#   ansible-playbook playbooks/site.yml --tags jarvis      # Solo deploy JARVIS
#   ansible-playbook playbooks/site.yml --tags security    # Solo stack sicurezza
#   ansible-playbook playbooks/site.yml --tags verify      # Solo verifica servizi
#
# Step by step:
#   ansible-playbook playbooks/site.yml --tags common,nvidia
#   ansible-playbook playbooks/site.yml --tags jarvis
#   ansible-playbook playbooks/site.yml --tags verify
#
# AI Agent (opzionale — NON incluso nel deploy automatico):
#   ansible-playbook playbooks/openclaw.yml                # Setup OpenClaw manualmente

- name: "Fase 1: Setup Sistema + Docker"
  ansible.builtin.import_playbook: common.yml
  tags: [common]

- name: "Fase 2: NVIDIA Driver + Container Toolkit (solo GPU)"
  ansible.builtin.import_playbook: nvidia.yml
  tags: [nvidia]

# Fase 3 (AI Agent) — rimossa dal deploy automatico.
# Per installare un AI Agent (OpenClaw/Hermes/altri), eseguire il playbook manualmente:
#   ansible-playbook playbooks/openclaw.yml
# In futuro verra aggiunto anche un playbook per Hermes.

- name: "Fase 3: Deploy JARVIS"
  ansible.builtin.import_playbook: jarvis.yml
  tags: [jarvis]

- name: "Fase 5: Security Stack (opzionale)"
  ansible.builtin.import_playbook: security.yml
  tags: [security]

- name: "Fase 6: Verifica Servizi"
  ansible.builtin.import_playbook: verify.yml
  tags: [verify]
