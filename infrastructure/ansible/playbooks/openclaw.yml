---
# =============================================================================
# JARVIS — OpenClaw VM Setup (locale)
# =============================================================================
# Setup della VM dedicata a OpenClaw nello scenario locale (Proxmox/LXC).
# Installa: Node.js 22, OpenClaw, Linuxbrew, Google Chrome (headless),
#           skill dependencies (codexbar, ffmpeg, gcc, gogcli, gifgrep,
#           goplaces, wacli, summarize), e configura il servizio systemd.
#
# Utilizzo:
#   ansible-playbook playbooks/openclaw.yml
#
# Prerequisiti:
#   - VM/LXC con Ubuntu 22.04/24.04
#   - Utente jarvis (creato dal playbook common.yml o manualmente)

- name: Setup OpenClaw VM
  hosts: openclaw
  become: true
  tags: [openclaw]

  vars:
    openclaw_user: "{{ jarvis_user | default('jarvis') }}"
    brew_prefix: "/home/linuxbrew/.linuxbrew"

  tasks:
    # -----------------------------------------------------------------
    # NODE.JS 22
    # -----------------------------------------------------------------
    - name: Verifica se Node.js >= 22 è installato
      ansible.builtin.command: node -v
      register: node_check
      changed_when: false
      failed_when: false

    - name: Installa Node.js 22
      when: node_check.rc != 0 or (node_check.stdout | regex_replace('^v', '') | split('.') | first | int) < 22
      block:
        - name: Aggiungi NodeSource repository
          ansible.builtin.shell: |
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          args:
            creates: /etc/apt/sources.list.d/nodesource.list

        - name: Installa nodejs
          ansible.builtin.apt:
            name: nodejs
            state: present
            update_cache: true

    - name: Mostra versione Node.js
      ansible.builtin.command: node -v
      register: node_version
      changed_when: false

    - name: "Node.js: {{ node_version.stdout }}"
      ansible.builtin.debug:
        msg: "Node.js {{ node_version.stdout }}"

    # -----------------------------------------------------------------
    # OPENCLAW
    # -----------------------------------------------------------------
    - name: Installa OpenClaw
      community.general.npm:
        name: openclaw
        global: true
        state: latest

    # -----------------------------------------------------------------
    # CREA UTENTE (se non esiste)
    # -----------------------------------------------------------------
    - name: Crea utente {{ openclaw_user }}
      ansible.builtin.user:
        name: "{{ openclaw_user }}"
        shell: /bin/bash
        groups: [sudo]
        append: true
        create_home: true
      when: openclaw_user != "root"

    - name: Configura sudo senza password per {{ openclaw_user }}
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/{{ openclaw_user }}
        line: "{{ openclaw_user }} ALL=(ALL) NOPASSWD:ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"
      when: openclaw_user != "root"

    - name: Abilita linger per {{ openclaw_user }}
      ansible.builtin.command: loginctl enable-linger {{ openclaw_user }}
      changed_when: false
      failed_when: false

    # -----------------------------------------------------------------
    # DIRECTORY OPENCLAW
    # -----------------------------------------------------------------
    - name: Crea directory OpenClaw
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0755"
      loop:
        - "/home/{{ openclaw_user }}/.openclaw"
        - "/home/{{ openclaw_user }}/.openclaw/workspace"
        - "/home/{{ openclaw_user }}/.openclaw/workspace/skills"

    # -----------------------------------------------------------------
    # GOOGLE CHROME (headless browser per OpenClaw)
    # -----------------------------------------------------------------
    - name: Verifica se Google Chrome è installato
      ansible.builtin.command: google-chrome --version
      register: chrome_check
      changed_when: false
      failed_when: false

    - name: Installa Google Chrome (non snap)
      when: chrome_check.rc != 0
      block:
        - name: Scarica Google Chrome .deb
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            dest: /tmp/google-chrome-stable.deb
            mode: "0644"

        - name: Installa Chrome .deb
          ansible.builtin.apt:
            deb: /tmp/google-chrome-stable.deb
            state: present

        - name: Rimuovi file .deb
          ansible.builtin.file:
            path: /tmp/google-chrome-stable.deb
            state: absent

    - name: Mostra versione Chrome
      ansible.builtin.command: google-chrome --version
      register: chrome_version
      changed_when: false

    - name: "Chrome: {{ chrome_version.stdout }}"
      ansible.builtin.debug:
        msg: "{{ chrome_version.stdout }}"

    # -----------------------------------------------------------------
    # BUILD-ESSENTIAL (necessario per wacli e compilazioni native)
    # -----------------------------------------------------------------
    - name: Installa build-essential
      ansible.builtin.apt:
        name: build-essential
        state: present

    # -----------------------------------------------------------------
    # LINUXBREW
    # -----------------------------------------------------------------
    - name: Verifica se Linuxbrew è installato
      ansible.builtin.stat:
        path: "{{ brew_prefix }}/bin/brew"
      register: brew_check

    - name: Installa Linuxbrew
      ansible.builtin.shell: |
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      become_user: "{{ openclaw_user }}"
      environment:
        HOME: "/home/{{ openclaw_user }}"
      when: not brew_check.stat.exists

    - name: Aggiungi brew al .bashrc di {{ openclaw_user }}
      ansible.builtin.lineinfile:
        path: "/home/{{ openclaw_user }}/.bashrc"
        line: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
        create: true
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0644"

    # -----------------------------------------------------------------
    # SKILL DEPENDENCIES (brew + npm)
    # -----------------------------------------------------------------
    - name: Installa skill dependencies via brew
      ansible.builtin.shell: |
        eval "$({{ brew_prefix }}/bin/brew shellenv)"

        # steipete tap
        brew tap steipete/tap 2>/dev/null || true

        # gcc + symlink
        brew install gcc 2>/dev/null || true
        brew postinstall gcc 2>/dev/null || true
        GCC_VERSION=$(ls {{ brew_prefix }}/bin/gcc-* 2>/dev/null | grep -oP 'gcc-\K[0-9]+' | sort -n | tail -1)
        if [ -n "$GCC_VERSION" ] && [ ! -e "{{ brew_prefix }}/bin/gcc" ]; then
            ln -sf "{{ brew_prefix }}/bin/gcc-${GCC_VERSION}" "{{ brew_prefix }}/bin/gcc"
            ln -sf "{{ brew_prefix }}/bin/g++-${GCC_VERSION}" "{{ brew_prefix }}/bin/g++"
        fi

        # Skill tools
        brew install steipete/tap/codexbar 2>/dev/null || true
        brew install ffmpeg-full 2>/dev/null || true
        brew install steipete/tap/gogcli 2>/dev/null || true
        brew install steipete/tap/gifgrep 2>/dev/null || true
        brew install steipete/tap/goplaces 2>/dev/null || true
        brew install steipete/tap/wacli 2>/dev/null || true

        # npm global
        npm i -g @steipete/summarize 2>/dev/null || true
      become_user: "{{ openclaw_user }}"
      environment:
        HOME: "/home/{{ openclaw_user }}"
      args:
        executable: /bin/bash

    # -----------------------------------------------------------------
    # OPENCLAW ENV FILE + GOGCLI DIRS
    # -----------------------------------------------------------------
    - name: Crea openclaw.env (se non esiste)
      ansible.builtin.copy:
        dest: "/home/{{ openclaw_user }}/.openclaw/openclaw.env"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0600"
        force: false
        content: |
          # OpenClaw env vars — compila con i tuoi valori
          # gogcli
          GOG_KEYRING_PASSWORD=
          GOG_ACCOUNT=

    - name: Crea directory gogcli credentials
      ansible.builtin.file:
        path: "/home/{{ openclaw_user }}/.config/gog"
        state: directory
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0700"

    # -----------------------------------------------------------------
    # DOCKER (per lab-server e futuri container)
    # -----------------------------------------------------------------
    - name: Verifica se Docker è installato
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Installa Docker Engine
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker
      when: docker_check.rc != 0

    - name: Aggiungi {{ openclaw_user }} al gruppo docker
      ansible.builtin.user:
        name: "{{ openclaw_user }}"
        groups: [docker]
        append: true
      when: openclaw_user != "root"

    - name: Configura Docker daemon (log rotation)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
      notify: Restart Docker

    - name: Assicura Docker avviato
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # -----------------------------------------------------------------
    # BROWSER-DOM PLUGIN (installato da migrazione o da repo)
    # -----------------------------------------------------------------
    - name: Verifica se browser-dom plugin esiste già (da migrazione)
      ansible.builtin.stat:
        path: "/home/{{ openclaw_user }}/.openclaw/extensions/browser-dom/package.json"
      register: browser_dom_migrated

    - name: Verifica se browser-dom plugin esiste nel repo
      ansible.builtin.stat:
        path: "{{ jarvis_dir | default('/opt/jarvis') }}/extensions/browser-dom/package.json"
      register: browser_dom_repo
      when: not browser_dom_migrated.stat.exists

    - name: Installa browser-dom plugin da repo (solo se non migrato)
      when: not browser_dom_migrated.stat.exists and browser_dom_repo.stat.exists | default(false)
      block:
        - name: Crea directory plugin browser-dom
          ansible.builtin.file:
            path: "/home/{{ openclaw_user }}/.openclaw/extensions/browser-dom"
            state: directory
            owner: "{{ openclaw_user }}"
            group: "{{ openclaw_user }}"
            mode: "0755"

        - name: Copia browser-dom plugin files
          ansible.builtin.copy:
            src: "{{ jarvis_dir | default('/opt/jarvis') }}/extensions/browser-dom/{{ item }}"
            dest: "/home/{{ openclaw_user }}/.openclaw/extensions/browser-dom/{{ item }}"
            owner: "{{ openclaw_user }}"
            group: "{{ openclaw_user }}"
            remote_src: true
          loop:
            - index.ts
            - package.json
            - openclaw.plugin.json
          ignore_errors: true

        - name: Copia browser-dom src directory
          ansible.builtin.copy:
            src: "{{ jarvis_dir | default('/opt/jarvis') }}/extensions/browser-dom/src/"
            dest: "/home/{{ openclaw_user }}/.openclaw/extensions/browser-dom/src/"
            owner: "{{ openclaw_user }}"
            group: "{{ openclaw_user }}"
            remote_src: true

    - name: Installa dipendenze npm browser-dom (sempre, anche post-migrazione)
      community.general.npm:
        path: "/home/{{ openclaw_user }}/.openclaw/extensions/browser-dom"
        production: true
      become_user: "{{ openclaw_user }}"
      when: browser_dom_migrated.stat.exists or (browser_dom_repo.stat.exists | default(false))

    # -----------------------------------------------------------------
    # CHROME HEADLESS — directory user-data
    # Chrome viene gestito da OpenClaw (`openclaw browser start`)
    # quando il plugin browser-dom è abilitato nel config.
    # NON serve un systemd service dedicato.
    # -----------------------------------------------------------------
    - name: Crea directory Chrome user-data
      ansible.builtin.file:
        path: "/home/{{ openclaw_user }}/.openclaw/browser/openclaw/user-data"
        state: directory
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0755"

    # -----------------------------------------------------------------
    # OPENCLAW GATEWAY SERVICE (user-level systemd via openclaw CLI)
    # Usa il service manager nativo di OpenClaw, NON systemd manuale.
    # Vantaggi: agent/Telegram può fare /restart senza sudo.
    # Richiede: loginctl enable-linger (già fatto sopra).
    # -----------------------------------------------------------------
    - name: Recupera UID utente {{ openclaw_user }}
      ansible.builtin.command: id -u {{ openclaw_user }}
      register: openclaw_uid
      changed_when: false

    - name: Installa OpenClaw gateway service (user-level systemd)
      ansible.builtin.command: openclaw gateway install
      become_user: "{{ openclaw_user }}"
      environment:
        HOME: "/home/{{ openclaw_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ openclaw_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ openclaw_uid.stdout }}/bus"
      register: gateway_install_result
      changed_when: "'installed' in gateway_install_result.stdout or gateway_install_result.rc == 0"
      failed_when: false

    - name: "Gateway install: {{ gateway_install_result.stdout | default('(nessun output)') }}"
      ansible.builtin.debug:
        msg: "{{ gateway_install_result.stdout | default('') }}"

    # -----------------------------------------------------------------
    # NGINX + CERTBOT TLS (reverse proxy per gateway API/WS + dashboard)
    # OpenClaw 2026.2.25+ richiede wss:// per connessioni non-loopback.
    # Nginx termina TLS e proxya a ws://127.0.0.1:18789.
    # -----------------------------------------------------------------
    - name: Installa Nginx + Certbot + Cloudflare DNS plugin
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-dns-cloudflare
        state: present
        update_cache: true

    - name: Rimuovi default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Crea Cloudflare credentials per certbot
      ansible.builtin.copy:
        dest: /etc/letsencrypt/cloudflare.ini
        owner: root
        group: root
        mode: "0600"
        content: |
          dns_cloudflare_api_token = {{ cloudflare_api_token }}
      when: cloudflare_api_token is defined and cloudflare_api_token != ''

    - name: Genera certificato SSL per openclaw.mintwork.it
      ansible.builtin.command: >
        certbot certonly
        --dns-cloudflare
        --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
        -d openclaw.mintwork.it
        --non-interactive
        --agree-tos
        -m {{ certbot_email | default('admin@mintwork.it') }}
      args:
        creates: /etc/letsencrypt/live/openclaw.mintwork.it/fullchain.pem
      when: cloudflare_api_token is defined and cloudflare_api_token != ''

    - name: Crea directory certs per OpenClaw
      ansible.builtin.file:
        path: "/home/{{ openclaw_user }}/.openclaw/certs"
        state: directory
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0755"

    - name: Copia certificati in directory OpenClaw-readable
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/home/{{ openclaw_user }}/.openclaw/certs/{{ item.dest }}"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "{{ item.mode }}"
        remote_src: true
      loop:
        - { src: "/etc/letsencrypt/live/openclaw.mintwork.it/fullchain.pem", dest: "fullchain.pem", mode: "0644" }
        - { src: "/etc/letsencrypt/live/openclaw.mintwork.it/privkey.pem", dest: "privkey.pem", mode: "0600" }
      when: cloudflare_api_token is defined and cloudflare_api_token != ''

    - name: Recupera IP Tailscale per nginx bind
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false
      failed_when: false

    - name: Configura nginx reverse proxy TLS per OpenClaw
      ansible.builtin.template:
        src: openclaw-gateway-nginx.conf.j2
        dest: /etc/nginx/sites-available/openclaw-gateway
        owner: root
        group: root
        mode: "0644"
      notify: Reload Nginx
      when: tailscale_ip.rc == 0

    - name: Abilita nginx site OpenClaw
      ansible.builtin.file:
        src: /etc/nginx/sites-available/openclaw-gateway
        dest: /etc/nginx/sites-enabled/openclaw-gateway
        state: link
      notify: Reload Nginx

    - name: Crea certbot deploy hook per auto-renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/openclaw.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          cp /etc/letsencrypt/live/openclaw.mintwork.it/fullchain.pem /home/{{ openclaw_user }}/.openclaw/certs/fullchain.pem
          cp /etc/letsencrypt/live/openclaw.mintwork.it/privkey.pem /home/{{ openclaw_user }}/.openclaw/certs/privkey.pem
          chown {{ openclaw_user }}:{{ openclaw_user }} /home/{{ openclaw_user }}/.openclaw/certs/*.pem
          chmod 600 /home/{{ openclaw_user }}/.openclaw/certs/privkey.pem
          chmod 644 /home/{{ openclaw_user }}/.openclaw/certs/fullchain.pem
          systemctl reload nginx 2>/dev/null || true
      when: cloudflare_api_token is defined and cloudflare_api_token != ''

    # -----------------------------------------------------------------
    # RIEPILOGO
    # -----------------------------------------------------------------
    - name: Riepilogo setup OpenClaw
      ansible.builtin.debug:
        msg: |
          ================================================================
          OpenClaw LXC Setup completato!
          ================================================================

          Componenti installati:
            - Node.js 22 + OpenClaw (gateway: user-level systemd)
            - Google Chrome (gestito da OpenClaw, non systemd manuale)
            - Docker Engine (per lab-server e futuri container)
            - Linuxbrew + skill dependencies
              (codexbar, ffmpeg, gcc, gogcli, gifgrep, goplaces, wacli, summarize)
            - Nginx reverse proxy TLS (Let's Encrypt + Cloudflare DNS)
            - Certbot auto-renewal con deploy hook

          TLS Endpoints:
            API + WSS: https://openclaw.mintwork.it:18789
            Dashboard: https://openclaw.mintwork.it (porta 443)

          Gestione servizi (come utente {{ openclaw_user }}, SENZA sudo):
            openclaw gateway start     # Avvia gateway + Chrome
            openclaw gateway stop      # Ferma gateway
            openclaw gateway restart   # Restart (anche da agent/Telegram)
            openclaw gateway status    # Stato servizio

          Prossimi passi:
            1. Importa dati dal VPS (migrate-import-lxc.sh)
            2. Connetti Tailscale: sudo tailscale up --hostname=jarvis-openclaw
            3. Configura cloudflare_api_token in group_vars/all.yml
            4. Avvia: openclaw gateway start
            5. Verifica: curl https://openclaw.mintwork.it:18789/health
          ================================================================

  handlers:
    - name: Ricarica systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
