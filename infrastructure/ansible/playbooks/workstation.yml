---
# =============================================================================
# JARVIS — VM Workstation Setup (Ubuntu Desktop)
# =============================================================================
# Configura la VM Workstation dopo l'installazione manuale di Ubuntu.
#
# Prerequisiti:
#   - Ubuntu Desktop 24.04 installato (da ISO via noVNC Proxmox)
#   - SSH accessibile (utente jarvis con sudo NOPASSWD)
#   - Rete configurata (IP statico o DHCP)
#
# Utilizzo:
#   ansible-playbook playbooks/workstation.yml
#
# Installa: qemu-guest-agent, Chrome, Git, nvm + Node.js LTS,
#           Python 3 + pip + venv, Zed IDE, RustDesk, Tailscale
#
# Accesso remoto:
#   - RustDesk (dal Mac, Direct IP via Tailscale o ID numerico)
#   - GNOME Remote Desktop (RDP :3389 — funziona da Remmina/Proxmox)
#   - noVNC dalla Proxmox Web UI (installazione e troubleshooting)
#
# NOTA: GNOME Remote Desktop RDP ha un bug noto con i client Mac
# (kkRemote, Windows App, Microsoft Remote Desktop) → black screen.
# RustDesk è la soluzione per accesso da Mac.

- name: Setup VM Workstation
  hosts: workstation
  become: true
  tags: [workstation]

  vars:
    ws_user: "{{ jarvis_user | default('jarvis') }}"
    nvm_version: "0.40.1"
    rustdesk_version: "1.4.5"
    install_tailscale: true
    # Password per GNOME Remote Desktop (RDP nativo) e RustDesk
    rdp_password: "{{ workstation_rdp_password | default('jarvis') }}"

  tasks:
    # -----------------------------------------------------------------
    # SYSTEM UPDATE + BASE PACKAGES
    # -----------------------------------------------------------------
    - name: Aggiorna cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Aggiorna tutti i pacchetti
      ansible.builtin.apt:
        upgrade: dist

    - name: Installa pacchetti base
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - nano
          - vim
          - htop
          - jq
          - ca-certificates
          - gnupg
          - lsb-release
          - build-essential
          - software-properties-common
          - unzip
          - apt-transport-https
        state: present

    # -----------------------------------------------------------------
    # QEMU GUEST AGENT (Proxmox integration)
    # -----------------------------------------------------------------
    - name: Installa QEMU Guest Agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Abilita QEMU Guest Agent (si avvia dopo reboot con agent=true in Proxmox)
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
      failed_when: false

    # -----------------------------------------------------------------
    # USER GROUPS (video + render per VirtIO-GPU / DRI)
    # -----------------------------------------------------------------
    - name: Aggiungi utente ai gruppi video e render
      ansible.builtin.user:
        name: "{{ ws_user }}"
        groups:
          - video
          - render
        append: true

    - name: Aggiungi gdm ai gruppi video e render (per GNOME Remote Desktop)
      ansible.builtin.user:
        name: gdm
        groups:
          - video
          - render
        append: true

    # -----------------------------------------------------------------
    # GNOME REMOTE DESKTOP (RDP nativo — porta 3389)
    # -----------------------------------------------------------------
    # Nota: funziona perfettamente da Remmina (Proxmox host).
    # Bug noto: client Mac (kkRemote, Windows App) → black screen.
    # Per accesso da Mac usare RustDesk (vedi sezione successiva).
    - name: Installa GNOME Remote Desktop
      ansible.builtin.apt:
        name: gnome-remote-desktop
        state: present

    - name: Disabilita Wayland in GDM (RDP richiede X11)
      ansible.builtin.lineinfile:
        path: /etc/gdm3/custom.conf
        regexp: '^#?WaylandEnable='
        line: 'WaylandEnable=false'

    - name: Abilita auto-login per l'utente
      ansible.builtin.blockinfile:
        path: /etc/gdm3/custom.conf
        insertafter: '^\[daemon\]'
        marker: "# {mark} ANSIBLE MANAGED - Auto-login"
        block: |
          AutomaticLoginEnable=True
          AutomaticLogin={{ ws_user }}

    - name: Abilita GNOME Remote Desktop system service
      ansible.builtin.systemd:
        name: gnome-remote-desktop
        enabled: true
        state: started

    - name: Configura credenziali RDP (system service)
      ansible.builtin.copy:
        dest: /var/lib/gnome-remote-desktop/credentials.ini
        content: |
          [RDP]
          username={{ ws_user }}
          password={{ rdp_password }}
        owner: gnome-remote-desktop
        group: gnome-remote-desktop
        mode: "0600"

    # -----------------------------------------------------------------
    # RUSTDESK (accesso remoto da Mac — alternativa a RDP)
    # -----------------------------------------------------------------
    # RustDesk risolve il bug black screen dei client Mac con GNOME RDP.
    # Supporta Direct IP (via Tailscale) → zero relay, connessione diretta.
    - name: Verifica se RustDesk è installato
      ansible.builtin.command: rustdesk --version
      register: rustdesk_check
      changed_when: false
      failed_when: false

    - name: Installa RustDesk
      when: rustdesk_check.rc != 0
      block:
        - name: Scarica RustDesk .deb
          ansible.builtin.get_url:
            url: "https://github.com/rustdesk/rustdesk/releases/download/{{ rustdesk_version }}/rustdesk-{{ rustdesk_version }}-x86_64.deb"
            dest: /tmp/rustdesk.deb
            mode: "0644"

        - name: Installa RustDesk
          ansible.builtin.apt:
            deb: /tmp/rustdesk.deb
            state: present

        - name: Rimuovi .deb
          ansible.builtin.file:
            path: /tmp/rustdesk.deb
            state: absent

    - name: Imposta password RustDesk per accesso unattended
      ansible.builtin.command: "rustdesk --password {{ rdp_password }}"
      changed_when: true

    - name: Configura RustDesk — permanent password + Direct IP
      ansible.builtin.command: "rustdesk --option {{ item.key }} {{ item.value }}"
      loop:
        - { key: "verification-method", value: "use-permanent-password" }
        - { key: "direct-server", value: "Y" }
        - { key: "allow-direct-server", value: "Y" }
      changed_when: true

    - name: Abilita servizio RustDesk
      ansible.builtin.systemd:
        name: rustdesk
        enabled: true
        state: started

    - name: Ottieni RustDesk ID
      ansible.builtin.command: rustdesk --get-id
      register: rustdesk_id
      changed_when: false

    # -----------------------------------------------------------------
    # DISABILITA SERVIZI INUTILI
    # -----------------------------------------------------------------
    - name: Disabilita SSSD (non configurato, genera warning)
      ansible.builtin.systemd:
        name: sssd
        enabled: false
        state: stopped
      failed_when: false

    # -----------------------------------------------------------------
    # GOOGLE CHROME
    # -----------------------------------------------------------------
    - name: Verifica se Chrome è installato
      ansible.builtin.command: google-chrome --version
      register: chrome_check
      changed_when: false
      failed_when: false

    - name: Installa Google Chrome
      when: chrome_check.rc != 0
      block:
        - name: Scarica Chrome .deb
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            dest: /tmp/google-chrome-stable.deb
            mode: "0644"

        - name: Installa Chrome
          ansible.builtin.apt:
            deb: /tmp/google-chrome-stable.deb
            state: present

        - name: Rimuovi .deb
          ansible.builtin.file:
            path: /tmp/google-chrome-stable.deb
            state: absent

    - name: Mostra versione Chrome
      ansible.builtin.command: google-chrome --version
      register: chrome_version
      changed_when: false

    - name: "Chrome: {{ chrome_version.stdout }}"
      ansible.builtin.debug:
        msg: "{{ chrome_version.stdout }}"

    # -----------------------------------------------------------------
    # GIT CONFIG
    # -----------------------------------------------------------------
    - name: Configura Git default branch
      ansible.builtin.command: git config --global init.defaultBranch main
      become_user: "{{ ws_user }}"
      changed_when: false

    - name: Genera chiave SSH (se non esiste)
      ansible.builtin.command: ssh-keygen -t ed25519 -C "jarvis-workstation" -f /home/{{ ws_user }}/.ssh/id_ed25519 -N ""
      become_user: "{{ ws_user }}"
      args:
        creates: "/home/{{ ws_user }}/.ssh/id_ed25519"

    # -----------------------------------------------------------------
    # NVM + NODE.JS
    # -----------------------------------------------------------------
    - name: Verifica se nvm è installato
      ansible.builtin.stat:
        path: "/home/{{ ws_user }}/.nvm/nvm.sh"
      register: nvm_check

    - name: Installa nvm
      ansible.builtin.shell: |
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh | bash
      become_user: "{{ ws_user }}"
      environment:
        HOME: "/home/{{ ws_user }}"
      args:
        creates: "/home/{{ ws_user }}/.nvm/nvm.sh"
      when: not nvm_check.stat.exists

    - name: Installa Node.js LTS via nvm
      ansible.builtin.shell: |
        export NVM_DIR="/home/{{ ws_user }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        nvm install --lts
        nvm alias default lts/*
      become_user: "{{ ws_user }}"
      environment:
        HOME: "/home/{{ ws_user }}"
      args:
        executable: /bin/bash
      register: node_install
      changed_when: "'is already installed' not in node_install.stderr"

    - name: Crea symlink node/npm/npx in /usr/local/bin (per sudo)
      ansible.builtin.shell: |
        NODE_PATH=$(su - {{ ws_user }} -c 'which node' 2>/dev/null)
        if [ -n "$NODE_PATH" ]; then
          NODE_DIR=$(dirname "$NODE_PATH")
          ln -sf "$NODE_PATH" /usr/local/bin/node
          ln -sf "$NODE_DIR/npm" /usr/local/bin/npm
          ln -sf "$NODE_DIR/npx" /usr/local/bin/npx
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verifica Node.js
      ansible.builtin.shell: |
        export NVM_DIR="/home/{{ ws_user }}/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        node --version
      become_user: "{{ ws_user }}"
      environment:
        HOME: "/home/{{ ws_user }}"
      args:
        executable: /bin/bash
      register: node_version
      changed_when: false

    - name: "Node.js: {{ node_version.stdout }}"
      ansible.builtin.debug:
        msg: "{{ node_version.stdout }}"

    # -----------------------------------------------------------------
    # PYTHON 3 + PIP + VENV
    # -----------------------------------------------------------------
    - name: Installa Python 3 tools
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
          - python3-dev
        state: present

    # -----------------------------------------------------------------
    # ZED IDE
    # -----------------------------------------------------------------
    - name: Verifica se Zed è installato
      ansible.builtin.stat:
        path: "/home/{{ ws_user }}/.local/bin/zed"
      register: zed_check

    - name: Installa Zed IDE
      ansible.builtin.shell: |
        curl -fsSL https://zed.dev/install.sh | sh
      become_user: "{{ ws_user }}"
      environment:
        HOME: "/home/{{ ws_user }}"
      when: not zed_check.stat.exists

    # -----------------------------------------------------------------
    # TAILSCALE (opzionale)
    # -----------------------------------------------------------------
    - name: Installa Tailscale
      ansible.builtin.shell: |
        curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale
      when: install_tailscale | default(true)

    # -----------------------------------------------------------------
    # /dev/shm (fix per Chrome in VM)
    # -----------------------------------------------------------------
    - name: Aumenta /dev/shm a 2 GB
      ansible.posix.mount:
        path: /dev/shm
        src: tmpfs
        fstype: tmpfs
        opts: defaults,size=2g
        state: mounted
      failed_when: false

    # -----------------------------------------------------------------
    # UFW FIREWALL
    # -----------------------------------------------------------------
    - name: Installa UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: UFW — consenti SSH
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: UFW — consenti RDP (GNOME Remote Desktop, per Remmina da Proxmox)
      community.general.ufw:
        rule: allow
        port: "3389"
        proto: tcp

    - name: UFW — consenti RustDesk Direct IP
      community.general.ufw:
        rule: allow
        port: "21118"
        proto: tcp

    - name: UFW — consenti RustDesk relay (21115-21119 TCP + UDP)
      community.general.ufw:
        rule: allow
        port: "21115:21119"

    - name: UFW — abilita
      community.general.ufw:
        state: enabled

    # -----------------------------------------------------------------
    # RIEPILOGO
    # -----------------------------------------------------------------
    - name: Riepilogo
      ansible.builtin.debug:
        msg: |
          ================================================================
          VM Workstation Setup completato!
          ================================================================

          Installati:
            - QEMU Guest Agent
            - GNOME Remote Desktop (RDP :3389 — per Remmina da Proxmox)
            - RustDesk {{ rustdesk_version }} (per accesso da Mac)
            - Google Chrome {{ chrome_version.stdout | default('') }}
            - Git + chiave SSH generata
            - nvm + Node.js {{ node_version.stdout | default('LTS') }}
            - Python 3 + pip + venv
            - Zed IDE
            - Tailscale (da connettere: tailscale up --hostname=jarvis-workstation)

          Accesso remoto:
            RustDesk (Mac/ovunque):
              ID: {{ rustdesk_id.stdout | default('vedi rustdesk --get-id') }}
              Password: quella configurata
              Direct IP (Tailscale): inserisci IP Tailscale nel client RustDesk

            RDP (da Proxmox con Remmina):
              {{ ansible_default_ipv4.address | default('IP della VM') }}:3389
              Username: {{ ws_user }}

            noVNC: dalla Proxmox Web UI (per troubleshooting)

          Prossimi passi:
            1. Installa RustDesk sul Mac (rustdesk.com) e connettiti
            2. Connetti Tailscale: sudo tailscale up --hostname=jarvis-workstation
            3. Configura Git: git config --global user.name/email
            4. Aggiungi chiave SSH a GitHub: cat ~/.ssh/id_ed25519.pub
            5. Apri Chrome e installa l'estensione OpenClaw browser
          ================================================================
