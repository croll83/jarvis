# =============================================================================
# JARVIS Security Stack — Mosquitto MQTT Broker
# =============================================================================
# Listeners: 1883 (TCP nativo), 9001 (WebSocket)
# Sicurezza: anonymous per rete interna
# In produzione: decommentare le righe di autenticazione

# TCP listener
listener 1883

# WebSocket listener
listener 9001
protocol websockets

# Anonymous access (rete interna)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Produzione: autenticazione ---
# password_file /mosquitto/config/passwd
# allow_anonymous false
