# =============================================================================
# JARVIS DOCKER STACK (Locale — GPU + GX10)
# =============================================================================
#
# ARCHITECTURE (AI Agent — Hermes/OpenClaw/others):
# - AI Agent (Hermes/OpenClaw/others): Brain — gira su VM separata (bare-metal)
# - JARVIS Orchestrator: Skill — domotics, memory, speaker ID, security, TTS
# - Qwen 2.5 3B (Q4_K_M): Pre-routing + tool calling (web_search, web_fetch,
#     memory_search, home_status) + offline fallback
# - Ollama: Hosts Qwen 2.5 3B (num_ctx 32768, 37/37 GPU) — solo LLM, no embeddings
# - fastembed: Embedding server CPU-only (nomic-embed-text-v1.5, ONNX, :11435)
#
# AUDIO SERVICES (su GX10 DGX Spark via Tailscale):
# - Parakeet STT (nvidia/parakeet-tdt-0.6b-v3): STT multilingue, ~5.1 GiB VRAM, :7865
# - Qwen3-TTS (Qwen3-TTS-12Hz-1.7B): TTS con voice cloning, ~4.4 GiB VRAM, :9880
# Nota: Whisper e XTTSv2 DEPRECATI — rimossi dallo stack Atomman per liberare VRAM
#
# VRAM BUDGET Atomman (RTX 5070 Laptop 8 GB, GPU dedicata — no display):
#   Ollama Qwen 2.5 3B Q4_K_M (weights+KV): ~2.6 GB  (misurato @ ctx=32768, 37/37 GPU)
#   Totale:                                   ~2.6 / 8.15 GB (~5.5 GB liberi per router upgrade)
#   NOTA: Embeddings (nomic-embed-text) su fastembed CPU — zero VRAM.
#   NOTA: STT e TTS ora su GX10 (128 GB VRAM) — zero VRAM locale.
#
# NOTA SU AI AGENT:
# AI Agent NON e in questo compose — gira bare-metal su una VM dedicata
# per isolamento di sicurezza. L'orchestrator lo raggiunge via Tailscale
# (es. http://jarvis-agent:18789). Vedi infrastructure/README.md.
#
# NOTA SU TAILSCALE:
# Tailscale gira host-level (NON in Docker) su entrambe le VM (GPU e AI Agent).
# L'orchestrator usa network_mode: host per vedere l'interfaccia Tailscale
# e raggiungere HA remoti, AI Agent, GX10 e MagicDNS direttamente.
# Installazione: curl -fsSL https://tailscale.com/install.sh | sh
#
# NOTA SU GX10 (NVIDIA DGX Spark):
# STT (Parakeet :7865) e TTS (Qwen3-TTS :9880) girano sul GX10 (100.98.187.12)
# come servizi systemd. L'orchestrator li raggiunge via Tailscale.
# Vedi infrastructure/gb10/gx10-full-inventory.md per dettagli.
#
# NOTA SU RESEMBLYZER:
# Resemblyzer e una libreria Python per speaker identification.
# NON e un container separato - e inclusa in requirements.txt dell'orchestrator.
# Gira DENTRO il container orchestrator.
#
# NOTA SU ADMIN UI:
# L'interfaccia admin (/admin) e embedded nell'orchestrator FastAPI.
# NON e un container separato.
#
# =============================================================================

services:
  # ===========================================================================
  # AI CORE - Ollama (Qwen 2.5 3B only — embeddings moved to fastembed)
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis_ollama
    volumes:
      - ollama_storage:/root/.ollama
      - ./models:/models  # Per Modelfile custom
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1             # Pipeline sequenziale (pre_route→embed→route)
      - OLLAMA_MAX_LOADED_MODELS=1      # Solo Qwen — embeddings su fastembed :11435
      # Context 32768: XTTS cleanup middleware stabilizza la VRAM (~1854 MB),
      # liberando ~540 MB extra rispetto al leak pre-fix. 32k testato: 37/37 layer
      # su GPU, 140 tok/s, totale ~3473 MiB (con XTTS+Whisper = ~6800 MiB / 8151).
      - OLLAMA_NUM_CTX=32768
      # OLLAMA_CONTEXT_LENGTH è il DEFAULT che Ollama usa quando un client
      # NON specifica num_ctx (es. AI Agent via /v1/messages, tool esterni).
      # Senza questo Ollama usa 4096 e forza un model reload catastrofico.
      # NOTA: OLLAMA_NUM_CTX NON funziona come default — solo CONTEXT_LENGTH lo fa.
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1           # Mantiene i modelli in VRAM permanentemente
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    # restart gestito da jarvis.sh (ordine VRAM-aware)

  # ===========================================================================
  # EMBEDDINGS - fastembed (nomic-embed-text-v1.5, CPU-only, ONNX)
  # ===========================================================================
  # Sostituisce nomic-embed-text su Ollama per eliminare il context switch
  # CUDA che rallenta Qwen di ~1.3s per ogni embedding call.
  # API Ollama-compatibile: POST /api/embeddings {"model":"...","prompt":"..."}
  # Usato da: orchestrator (context_builder.py), AI Agent
  fastembed:
    build: ./infrastructure/fastembed
    container_name: jarvis_fastembed
    ports:
      - "11435:11435"
    volumes:
      - fastembed_cache:/root/.cache    # Cache modello ONNX (~260 MB)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11435/api/tags')"]
      interval: 30s
      timeout: 10s
      retries: 3
    # restart gestito da jarvis.sh

  # ===========================================================================
  # SPEECH-TO-TEXT & TTS — Ora su GX10 DGX Spark (via Tailscale)
  # ===========================================================================
  # STT: Parakeet (nvidia/parakeet-tdt-0.6b-v3) su GX10 :7865
  # TTS: Qwen3-TTS (Qwen3-TTS-12Hz-1.7B) su GX10 :9880
  # Whisper e XTTSv2 DEPRECATI — Dockerfile mantenuti in *-deprecated/
  # Questo libera ~3.6 GB VRAM sull'Atomman per upgrade router (100K ctx)
  #
  # ===========================================================================
  # JARVIS ORCHESTRATOR - AI Agent Skill (FastAPI)
  # Include: Qwen pre-routing + tool calling (web_search, web_fetch, memory, home),
  # HA control, Memory, Speaker ID, Security L1-L4
  # Admin UI (/admin), Backup/Restore, SSE event bus
  #
  # network_mode: host permette all'orchestrator di:
  #   - Raggiungere Ollama/Whisper su localhost (porte esposte sull'host)
  #   - Raggiungere HA remoti via Tailscale (100.x.x.x, host-level)
  #   - Raggiungere AI Agent sulla VM separata via Tailscale MagicDNS
  # ===========================================================================
  orchestrator:
    build: ./jarvis-orchestrator
    container_name: jarvis_core
      #depends_on:
      #ollama:
      #  condition: service_healthy
    network_mode: host
    volumes:
      - ./data:/app/data                    # SQLite + voice models
      - ./config:/app/config:ro             # Entity map, system prompt (sotto git)
    env_file: .env
    environment:
      - AI_BACKEND=${AI_BACKEND:-local}
      - OLLAMA_URL=http://localhost:11434
      - EMBEDDING_URL=http://localhost:11435   # fastembed (CPU, ONNX) — no GPU context switch
      # Memory: Redis context bus + mem0 long-term
      - REDIS_URL=${REDIS_URL}
      - MEM0_BASE_URL=${MEM0_BASE_URL}
      # STT (Parakeet su GX10 via Tailscale)
      - STT_ENGINE=parakeet
      - STT_URL=http://100.98.187.12:9000
      # AI Agent gira su VM separata — raggiungibile via Tailscale + TLS
      - AI_AGENT_URL=${AI_AGENT_URL:-}
      - AI_AGENT_TOKEN=${AI_AGENT_TOKEN:-}
      # Gateway WS for exec approval operator (same host/port, wss:// scheme)
      - AI_AGENT_WS_URL=${AI_AGENT_WS_URL:-}
      # Device firmware auth (AtomS3R Bearer token)
      - DEVICE_API_TOKEN=${DEVICE_API_TOKEN:-}
      # JARVIS Approval Bot (L3 critical actions - separate from AI Agent Telegram)
      - JARVIS_APPROVAL_BOT_TOKEN=${JARVIS_APPROVAL_BOT_TOKEN:-}
      - JARVIS_APPROVAL_CHAT_ID=${JARVIS_APPROVAL_CHAT_ID:-}
      # TTS (Qwen3-TTS su GX10 via Tailscale)
      - TTS_ENGINE=qwen3tts
      - QWEN3_TTS_URL=http://100.98.187.12:9880
      - QWEN3_TTS_VOICE=${QWEN3_TTS_VOICE:-sofia}
      # Qwen tool calling (Brave Search)
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - ROUTER_ENGINE=${ROUTER_ENGINE:-ollama}
      - ROUTER_URL=${ROUTER_URL:-http://localhost:11434}
      - ROUTER_MODEL=${ROUTER_MODEL:-qwen2.5:3b-32k}
      - OLLAMA_NUM_CTX=32768
      # API keys (only needed if AI_BACKEND=api)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # restart gestito da jarvis.sh

  # ===========================================================================
  # SECURITY (Frigate + DoubleTake)
  # =============================================================================
  # Frigate e DoubleTake sono stati spostati in security/docker-compose.security.yml
  # Questo permette di deployarli separatamente (es. su un server con accesso alle camere)
  # Per avviare: cd security && docker compose -f docker-compose.security.yml up -d

  # ===========================================================================
  # REDIS → su LXC Jarvis (vedi compose LXC), URL in .env REDIS_URL
  # ===========================================================================

  # ===========================================================================
  # MEM0-STACK (vector + graph + LLM router) — MOVED to separate repo
  # ===========================================================================
  # ChromaDB e mem0-server NON sono piu' in questo compose.
  # Vivono nel repo croll83/mem0-stack (deploy indipendente).
  # L'orchestrator e ha-memory-service li consumano via MEM0_BASE_URL.

  # ===========================================================================
  # DATABASES - Side Projects
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: jarvis_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-main}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-main}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # restart gestito da jarvis.sh

  mongo:
    image: mongo:7
    container_name: jarvis_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-jarvis}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    # restart gestito da jarvis.sh

  # ===========================================================================
  # OPTIONAL: Adminer (DB Web UI)
  # Avvia con: docker-compose --profile tools up adminer
  # ===========================================================================
  adminer:
    image: adminer:latest
    container_name: jarvis_adminer
    ports:
      - "8080:8080"
    profiles:
      - tools

volumes:
  ollama_storage:
  fastembed_cache:
  postgres_data:
  mongo_data:
