# =============================================================================
# JARVIS DOCKER STACK (Locale — GPU)
# =============================================================================
#
# ARCHITECTURE (OpenClaw + Gemini 3 Pro):
# - OpenClaw (Gemini 3 Pro): Brain — gira su VM separata (bare-metal)
# - JARVIS Orchestrator: Skill — domotics, memory, speaker ID, security, TTS
# - XTTSv2 (Coqui): TTS engine (voice cloning italiana, GPU accelerated)
# - Qwen3.5 4B: Local pre-routing for domotics fast path + offline fallback
# - Whisper large-v3-turbo: Speech-to-text (GPU, int8_float16, ~1 GB VRAM)
# - Ollama: Hosts Qwen3.5 4B (num_ctx=3072) + nomic-embed-text
#
# VRAM BUDGET (RTX 5070 Laptop 8 GB, GPU dedicata — no display):
#   Qwen3.5 4B (weights + KV 3072): ~3.5 GB
#   XTTSv2 (PyTorch fp16):          ~3.2 GB
#   Whisper large-v3-turbo (int8):   ~1.0 GB
#   Totale:                          ~7.7 / 8.15 GB (~0.45 GB buffer CUDA)
#
# NOTA SU OPENCLAW:
# OpenClaw NON e in questo compose — gira bare-metal su una VM dedicata
# per isolamento di sicurezza. L'orchestrator lo raggiunge via Tailscale
# (es. http://jarvis-openclaw:18789). Vedi infrastructure/README.md.
#
# NOTA SU TAILSCALE:
# Tailscale gira host-level (NON in Docker) su entrambe le VM (GPU e OpenClaw).
# L'orchestrator usa network_mode: host per vedere l'interfaccia Tailscale
# e raggiungere HA remoti, OpenClaw e MagicDNS direttamente.
# Installazione: curl -fsSL https://tailscale.com/install.sh | sh
#
# NOTA SU RESEMBLYZER:
# Resemblyzer e una libreria Python per speaker identification.
# NON e un container separato - e inclusa in requirements.txt dell'orchestrator.
# Gira DENTRO il container orchestrator.
#
# NOTA SU ADMIN UI:
# L'interfaccia admin (/admin) e embedded nell'orchestrator FastAPI.
# NON e un container separato.
#
# =============================================================================

services:
  # ===========================================================================
  # AI CORE - Ollama (Qwen3.5 4B + nomic-embed-text)
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis_ollama
    volumes:
      - ollama_storage:/root/.ollama
      - ./models:/models  # Per Modelfile custom
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_CTX=3072            # Copre 2 location (~2280 tok) con margine, ~0.9 GB KV
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # SPEECH-TO-TEXT - faster-whisper (GPU accelerated)
  # ===========================================================================
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: jarvis_whisper
    ports:
      - "9000:8000"
    environment:
      - WHISPER__MODEL=/models/faster-whisper-large-v3-turbo
      - WHISPER__DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float16          # ~1.6 GB VRAM (int8 non supportato su Blackwell/cuBLAS 12.2)
      - WHISPER__TTL=-1                        # Mai scaricare il modello dalla VRAM
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ../models/faster-whisper-large-v3-turbo:/models/faster-whisper-large-v3-turbo:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ===========================================================================
  # TTS - XTTSv2 / Coqui (GPU accelerated, voice cloning italiana)
  # ===========================================================================
  # Modello: XTTSv2 (~1.9 GB su disco, ~2.1 GB VRAM fp16)
  # Al primo avvio scarica il modello automaticamente (~2 min con buona connessione).
  # Per voice cloning: metti un WAV di riferimento (6-15s, mono, 22050Hz+) in ./speakers/
  # API docs: http://localhost:8890/docs
  xtts:
    build: ./xtts-custom
    image: jarvis/xtts-blackwell:latest
    container_name: jarvis_xtts
    ports:
      - "8890:8020"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - EXAMPLE_FOLDER=/app/speakers            # Speaker folder override (CMD uses -sf $EXAMPLE_FOLDER)
      # DeepSpeed per 2-4x speedup (opzionale, richiede piu RAM di sistema)
      # - DEEPSPEED=1
    volumes:
      - xtts_models:/root/.local/share/tts   # Cache modello XTTSv2 (~1.9 GB)
      - ./speakers:/app/speakers              # WAV di riferimento per voice cloning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/docs"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s  # Primo avvio: download modello + caricamento GPU
    restart: unless-stopped

  # ===========================================================================
  # JARVIS ORCHESTRATOR - OpenClaw Skill (FastAPI)
  # Include: Qwen pre-routing, HA control, Memory, Speaker ID, Security L1-L4
  # Admin UI (/admin), Backup/Restore, SSE event bus
  #
  # network_mode: host permette all'orchestrator di:
  #   - Raggiungere Ollama/Whisper su localhost (porte esposte sull'host)
  #   - Raggiungere HA remoti via Tailscale (100.x.x.x, host-level)
  #   - Raggiungere OpenClaw sulla VM separata via Tailscale MagicDNS
  # ===========================================================================
  orchestrator:
    build: ./jarvis-orchestrator
    container_name: jarvis_core
    depends_on:
      ollama:
        condition: service_healthy
      whisper:
        condition: service_started
      xtts:
        condition: service_started
    network_mode: host
    volumes:
      - ./data:/app/data                    # SQLite + voice models
      - ./config:/app/config:ro             # Entity map, system prompt
    env_file: .env
    environment:
      - AI_BACKEND=${AI_BACKEND:-local}
      - OLLAMA_URL=http://localhost:11434
      - WHISPER_URL=http://localhost:9000
      # OpenClaw gira su VM separata — raggiungibile via Tailscale + TLS
      - OPENCLAW_URL=${OPENCLAW_URL:-https://openclaw.mintwork.it:18789}
      - OPENCLAW_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      # Gateway WS for exec approval operator (same host/port, wss:// scheme)
      - OPENCLAW_WS_URL=${OPENCLAW_WS_URL:-wss://openclaw.mintwork.it:18789}
      # Device firmware auth (AtomS3R Bearer token)
      - DEVICE_API_TOKEN=${DEVICE_API_TOKEN:-}
      # JARVIS Approval Bot (L3 critical actions - separate from OpenClaw Telegram)
      - JARVIS_APPROVAL_BOT_TOKEN=${JARVIS_APPROVAL_BOT_TOKEN:-}
      - JARVIS_APPROVAL_CHAT_ID=${JARVIS_APPROVAL_CHAT_ID:-}
      # TTS (XTTSv2 — porta esposta su host via xtts service)
      - TTS_ENGINE=xtts
      - XTTS_URL=http://localhost:8890
      # API keys (only needed if AI_BACKEND=api)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # ===========================================================================
  # ONTOLOGY SERVER - Knowledge Graph API (SQLite + FastAPI + ACL)
  # Single source of truth per l'intero ecosistema di agent.
  # ACL basata su X-Speaker-Id: filtra entita per visibilita (private/family/public).
  # Raggiungibile da:
  #   - Orchestrator: http://127.0.0.1:8100 (network_mode: host)
  #   - OpenClaw (bare-metal): http://127.0.0.1:8100 (porta esposta su localhost)
  # ===========================================================================
  ontology-server:
    build: ./ontology-server
    container_name: jarvis_ontology
    volumes:
      - ontology_data:/app/data               # Persistent SQLite graph.db
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - ONTOLOGY_DB_PATH=/app/data/graph.db
      - ONTOLOGY_SCHEMA_PATH=/app/schema.yaml
      - ONTOLOGY_API_TOKEN=${ONTOLOGY_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # SECURITY (Frigate + DoubleTake)
  # =============================================================================
  # Frigate e DoubleTake sono stati spostati in security/docker-compose.security.yml
  # Questo permette di deployarli separatamente (es. su un server con accesso alle camere)
  # Per avviare: cd security && docker compose -f docker-compose.security.yml up -d

  # ===========================================================================
  # DATABASES - Side Projects
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: jarvis_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-main}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: jarvis_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-jarvis}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

  # ===========================================================================
  # OPTIONAL: Adminer (DB Web UI)
  # Avvia con: docker-compose --profile tools up adminer
  # ===========================================================================
  adminer:
    image: adminer:latest
    container_name: jarvis_adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    profiles:
      - tools

volumes:
  ollama_storage:
  xtts_models:
  postgres_data:
  mongo_data:
  ontology_data:
